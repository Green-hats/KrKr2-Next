name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.devtools/vcpkg
      VCPKG_DISABLE_METRICS: 1
      VCPKG_MAX_CONCURRENCY: 3
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore native dependency cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-arm64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-arm64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install native build tools
        run: |
          brew install autoconf automake autoconf-archive gettext libtool pkg-config bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Set up vcpkg at the repository baseline
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout b1e15efef6758eaa0beb0a8732cfa66f6a68a81d
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Build release app
        shell: bash
        run: ./build.sh macos release --jobs=3

      - name: Show native build diagnostics on failure
        if: failure()
        shell: bash
        run: |
          find "$VCPKG_ROOT/buildtrees" -type f -name '*-err.log' -mmin -10 -print -exec tail -n 80 {} \; || true

      - name: Save native dependency cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-arm64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}

      - name: Verify and package app
        shell: bash
        run: |
          app="apps/flutter_app/build/macos/Build/Products/Release/KrKr2 Next.app"
          test -d "$app"
          test -f "$app/Contents/Frameworks/libengine_api.dylib"
          python3 - "$app/Contents/Frameworks/libengine_api.dylib" <<'PY'
          import ctypes
          import sys
          ctypes.CDLL(sys.argv[1])
          print("engine_api dlopen OK")
          PY
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/KrKr2-Next-macos-arm64.zip
          (cd dist && shasum -a 256 KrKr2-Next-macos-arm64.zip > SHA256SUMS)

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: KrKr2-Next-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
