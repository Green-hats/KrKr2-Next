name: Build macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.devtools/vcpkg
      VCPKG_DISABLE_METRICS: 1
      VCPKG_MAX_CONCURRENCY: 3

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up vcpkg at the repository baseline
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout b1e15efef6758eaa0beb0a8732cfa66f6a68a81d
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Build release app
        shell: bash
        run: ./build.sh macos release --jobs=3

      - name: Verify and package app
        shell: bash
        run: |
          app="apps/flutter_app/build/macos/Build/Products/Release/KrKr2 Next.app"
          test -d "$app"
          test -f "$app/Contents/Frameworks/libengine_api.dylib"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/KrKr2-Next-macos-arm64.zip
          (cd dist && shasum -a 256 KrKr2-Next-macos-arm64.zip > SHA256SUMS)

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: KrKr2-Next-macos-arm64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
